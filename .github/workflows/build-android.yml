name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Create proper index.html
        run: |
          CSS_FILE=$(ls .output/public/assets/*.css | head -n 1 | xargs basename)
          JS_FILE=$(ls .output/public/assets/index-*.js | head -n 1 | xargs basename)
          
          cat > .output/public/index.html << EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
            <title>Runtoday</title>
            <link rel="stylesheet" href="/assets/${CSS_FILE}" />
          </head>
          <body>
            <div id="root"></div>
            <script type="module" src="/assets/${JS_FILE}"></script>
          </body>
          </html>
          EOF
          
          echo "Created index.html with CSS: $CSS_FILE and JS: $JS_FILE"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
